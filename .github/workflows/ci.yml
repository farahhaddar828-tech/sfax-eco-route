name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write


jobs:
  backend:
    name: Backend – lint & test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest pytest-cov ruff
      - run: ruff check app tests --select E,F,W,B --ignore E501,B008,B905
      - run: pytest -q --cov=app --cov-report=term-missing

  mobile:
    name: Flutter – analyze, test, build APK
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # Generates the missing platform folders; existing files (our AndroidManifest) are kept
      - run: flutter create . --org tn.ecoroute --project-name eco_route --platforms=android,web
      - run: rm -f test/widget_test.dart      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'http://10.0.2.2:8000' }}
      - uses: actions/upload-artifact@v4
        with: { name: eco-route-apk, path: mobile/build/app/outputs/flutter-apk/app-release.apk }

  infra:
    name: IaC – validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check && terraform -chdir=infra/terraform init -backend=false && terraform -chdir=infra/terraform validate
      - name: Validate k8s manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize infra/k8s | ./kubeconform -strict -summary
      - name: Validate compose file
        run: cp .env.example .env && docker compose config -q

  image:
    name: Build & push image
    needs: [backend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta   # GHCR names must be lowercase
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/eco-route-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }},${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"     # report only; flip to "1" to block releases

  deploy:
    name: Deploy to k3s
    needs: [image, infra]
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube && echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
      - name: Pin image to this commit and apply
        working-directory: infra/k8s
        run: |
          IMAGE='${{ needs.image.outputs.image }}'
          sed -i "s#ghcr.io/OWNER/eco-route-backend#${IMAGE}#g" *.yaml
          sed -i "s/newTag: latest/newTag: ${{ needs.image.outputs.tag }}/" kustomization.yaml
          kubectl apply -k .
          kubectl -n eco-route rollout status deploy/backend --timeout=180s
      - name: Smoke test
        run: |
          kubectl -n eco-route run smoke --rm -i --restart=Never --image=curlimages/curl -- \
            curl -fsS http://backend/readyz
