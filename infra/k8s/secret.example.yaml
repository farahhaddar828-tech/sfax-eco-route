# NOT applied by kustomize. Create the real secret with:
#   kubectl -n eco-route create secret generic ecoroute-secrets \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=DATABASE_URL=postgresql+psycopg://ecoroute:...@postgres:5432/ecoroute \
#     --from-literal=ANTHROPIC_API_KEY= --from-literal=OPENAI_API_KEY= --from-literal=XAI_API_KEY= \
#     --from-literal=N8N_ENCRYPTION_KEY=...
# (or use Sealed Secrets / External Secrets with AWS Secrets Manager in a real deployment)
apiVersion: v1
kind: Secret
metadata:
  name: ecoroute-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql+psycopg://ecoroute:change-me@postgres:5432/ecoroute
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  XAI_API_KEY: ""
  N8N_ENCRYPTION_KEY: change-me
