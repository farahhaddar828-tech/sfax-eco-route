groups:
  - name: eco-route
    rules:
      - alert: BackendHighErrorRate
        expr: sum(rate(http_requests_total{status="5xx"}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: page }
        annotations: { summary: "More than 5% of API requests fail" }
      - alert: SlowApi
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "p95 latency above 1 s" }
      - alert: CriticalBacklog
        expr: ecoroute_open_reports{priority="critical"} > 10
        for: 30m
        labels: { severity: warn }
        annotations: { summary: "More than 10 critical citizen reports are open" }
      - alert: SlaBreaches
        expr: ecoroute_sla_breached > 5
        for: 1h
        labels: { severity: warn }
        annotations: { summary: "Several reports are past their SLA" }
